name: collect-analyze-deploy

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  collect:
    runs-on: [self-hosted, windows]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Prepare folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data/batch | Out-Null
          New-Item -ItemType Directory -Force -Path data/meta | Out-Null

      - name: Collect GraphQL responses with browser
        env:
          CHROME_PROFILE_DIR: C:\naverlab\chrome-profile
        run: |
          python scripts/collect_control_group.py

      - name: Upload collected batch
        uses: actions/upload-artifact@v4
        with:
          name: collected-batch
          path: |
            data/batch/**
            data/meta/**
          if-no-files-found: warn

  analyze:
    runs-on: ubuntu-latest
    needs: collect
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download collected batch
        uses: actions/download-artifact@v4
        with:
          name: collected-batch
          path: data

      - name: Show downloaded files
        run: |
          pwd
          find data -maxdepth 3 -type f | sort || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run analyze
        run: |
          python scripts/analyze.py
          ls -la dist
          test -f dist/report.json

      - name: Build site
        run: |
          python scripts/build_site.py
          ls -la docs
          test -f docs/index.html
          test -f docs/report.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Upload debug outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-output
          path: |
            dist/**
            docs/**
          if-no-files-found: warn

  deploy:
    runs-on: ubuntu-latest
    needs: analyze
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
