name: analyze-and-deploy

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "config/**"
      - "data/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/analyze-and-deploy.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Debug repository tree
        run: |
          echo "PWD=$(pwd)"
          echo "===== ls -la ====="
          ls -la
          echo "===== top-level files ====="
          find . -maxdepth 3 -type f | sort

      - name: Validate required files
        run: |
          test -f requirements.txt || (echo "requirements.txt not found" && exit 1)
          test -f scripts/analyze.py || (echo "scripts/analyze.py not found" && exit 1)
          test -f scripts/build_site.py || (echo "scripts/build_site.py not found" && exit 1)
          test -f config/control_group.json || (echo "config/control_group.json not found" && exit 1)

          mkdir -p data/batch dist docs

      - name: Install dependencies
        run: |
          python -V
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analyze
        run: |
          python scripts/analyze.py
          echo "===== dist after analyze ====="
          ls -la dist || true
          test -f dist/report.json || (echo "dist/report.json not created" && exit 1)

      - name: Build static site
        run: |
          python scripts/build_site.py
          echo "===== docs after build ====="
          ls -la docs || true
          test -f docs/index.html || (echo "docs/index.html not created" && exit 1)
          test -f docs/report.json || (echo "docs/report.json not created" && exit 1)

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-output
          path: |
            dist
            docs
          if-no-files-found: warn

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
