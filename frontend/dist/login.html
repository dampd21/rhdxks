<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - Sherpain21</title>
  <style>
    .auth-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--color-surface); }
    .auth-card { width: 100%; max-width: 400px; padding: 40px; background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
    .auth-header { text-align: center; margin-bottom: 32px; }
    .auth-logo { font-family: var(--font-brand); font-size: 24px; font-weight: 800; color: var(--color-primary); margin-bottom: 8px; }
  </style>
  <script type="module" crossorigin src="./assets/login-B-BLpQAo.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/auth-Be7VZ7y5.js">
  <link rel="stylesheet" crossorigin href="./assets/app-DL5Nu7Ce.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">Sherpain21</div>
        <p class="text-body-sm text-gray">비즈니스의 정상을 향한 안내자</p>
      </div>
      <form id="login-form">
        <div style="margin-bottom:16px;">
          <label class="text-caption text-gray">아이디</label>
          <input type="text" id="login-id" class="form-input" required>
        </div>
        <div style="margin-bottom:24px;">
          <label class="text-caption text-gray">비밀번호</label>
          <input type="password" id="login-pw" class="form-input" required>
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg">로그인</button>
      </form>
      <div style="margin-top:24px; text-align:center;">
        <a href="./signup.html" class="text-body-sm text-accent">계정이 없으신가요? 회원가입</a>
      </div>
    </div>
  </div>
</body>
</html>
