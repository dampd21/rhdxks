<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - Sherpain21</title>
  <style>
    .auth-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--color-surface); }
    .auth-card { width: 100%; max-width: 460px; padding: 40px; background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
  </style>
  <script type="module" crossorigin src="./assets/auth-Be7VZ7y5.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/app-DL5Nu7Ce.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h2 style="font-size:20px; font-weight:800; margin-bottom:24px; text-align:center;">무료로 시작하기</h2>
      <form id="signup-form">
        <div style="margin-bottom:16px;">
          <label class="text-caption text-gray">이름</label>
          <input type="text" id="name" class="form-input" required>
        </div>
        <div style="margin-bottom:16px;">
          <label class="text-caption text-gray">아이디</label>
          <input type="text" id="login-id" class="form-input" required>
        </div>
        <div style="margin-bottom:24px;">
          <label class="text-caption text-gray">비밀번호</label>
          <input type="password" id="pw" class="form-input" required>
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg">회원가입 완료</button>
      </form>
    </div>
  </div>
</body>
</html>
