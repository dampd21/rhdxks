  <div class="app-layout"><div id="sidebar-container"></div><div class="app-main-wrapper"><div id="topbar-container"></div><main class="app-content"><div class="board-doc-page"><section class="board-doc-shell"><div class="board-doc-header"><div class="board-doc-header-main"><div class="board-doc-kicker">자유홍보 글쓰기</div><h1 class="board-doc-title">홍보 글 작성</h1><p class="board-doc-desc">서비스 소개와 연락처를 페이지형으로 작성합니다.</p></div><div class="board-doc-actions"><a class="btn btn-secondary" href="/app/partner/services.html#promo">목록으로</a></div></div><div class="board-doc-body"><section class="board-editor-main"><form id="promo-page-write-form" class="form-row"><div class="board-editor-field"><label class="board-editor-label" for="promo-page-write-category">홍보 카테고리</label><select class="select board-compact-control" id="promo-page-write-category"><option>블로그</option><option>플레이스/리뷰</option><option>인스타/스레드/유튜브</option><option>당근마켓</option><option>원고/디자인/촬영</option><option>기타 서비스</option></select></div><div class="board-editor-field"><label class="board-editor-label" for="promo-page-write-title">홍보 제목</label><input class="input board-compact-control" id="promo-page-write-title" placeholder="홍보 제목을 입력하세요" /></div><div class="board-editor-field"><label class="board-editor-label" for="promo-editor-surface">홍보 내용</label><div class="input board-editor-surface" id="promo-editor-surface" contenteditable="true"></div></div><div class="modal-footer" style="padding:0; justify-content:flex-end; margin-top:4px;"><button class="btn btn-ghost" type="button" id="promo-write-reset">초기화</button><button class="btn btn-primary" type="submit">등록하기</button></div></form></section></div></section></div></main></div></div>
